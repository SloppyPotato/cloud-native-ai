name: einordnen
version: 1
beschreibung: System-Prompt aus Übung 1, ohne Beispiele
autor: Starter
erstellt: 2026-10-13
temperature: 0
system: >-
  Du ordnest Mails von Studierenden an die HTWG Konstanz ein.
